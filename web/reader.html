<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>文档阅读 · 澄知 RAG</title>
  <link rel="stylesheet" href="/reader.css">
  <script type="module" src="/reader.js"></script>
</head>
<body>
  <a class="skip-link" href="#original-pane">跳至原件</a>
  <header class="header"><div class="header-inner">
    <a href="/" class="brand" aria-label="澄知 RAG，返回问答">
      <svg viewBox="0 0 32 32" width="27" height="27" aria-hidden="true"><path d="m3 11 13-7 13 7-13 7z" fill="currentColor"/><path d="m4 17 12 7 12-7m-24 5 12 7 12-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>澄知 RAG</a>
    <a class="back" href="/#documents"><span aria-hidden="true">←</span> 返回文档库</a>
  </div></header>
  <main>
    <section id="message-panel" class="message-panel" role="status">
      <h1 id="message-title">正在打开文档…</h1><p id="message-detail"></p>
      <div class="message-actions">
        <button id="retry" class="btn" type="button" hidden>重试</button>
        <a id="login" class="btn primary" href="/" target="_blank" rel="noopener noreferrer" hidden>前往工作台登录</a>
        <a id="message-download" class="btn" download hidden>下载原件</a>
        <a id="document-home" class="btn" hidden>打开原件首页</a>
      </div>
    </section>
    <section id="reader" aria-labelledby="filename" hidden>
      <header class="document-head">
        <div class="document-title">
          <h1 id="filename"></h1>
          <p class="file-meta"><span id="file-size"></span><span id="archived" class="archived" hidden>历史版本</span>
            <span id="citation-location" hidden></span></p>
        </div>
        <div class="file-actions">
          <a class="btn" id="open-original" target="_blank" rel="noopener noreferrer" hidden>在新标签打开原件 ↗</a>
          <a class="btn primary" id="download" download>下载原件</a>
        </div>
      </header>
      <div id="original-pane" class="original-pane" tabindex="-1" aria-label="文件原件"></div>
      <details id="checksum" class="checksum" hidden><summary>原件校验值（SHA-256）</summary><code id="digest"></code></details>
    </section>
  </main>
</body>
</html>
