<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f7ff">
  <title>知识问答 · 澄知 RAG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23264fd6'/%3E%3Cpath d='m7 16 13-7 13 7-13 7zM8 22l12 7 12-7' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/management.css">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/evidence.css">
  <link rel="stylesheet" href="/accounts.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main">跳至工作区</a>
  <aside class="sidebar" id="sidebar" aria-label="工作台导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="m6 13 12-6 12 6-12 6z" fill="currentColor"/><path d="m6 18 12 6 12-6M6 23l12 6 12-6" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
      <span><strong>澄知 RAG</strong><small>企业知识工作台</small></span>
      <button id="close-menu" class="nav-close icon-button" aria-label="关闭导航"></button>
    </div>
    <div class="sidebar-body" id="sidebar-body" hidden>
      <nav class="nav-actions" aria-label="工作区功能">
        <button type="button" id="new-question" class="new-question"></button>
        <a class="nav-item" id="library-link" href="#documents"></a>
      </nav>
      <section class="history-section" aria-labelledby="history-heading">
        <h2 id="history-heading">查询历史</h2>
        <label class="history-search"><span id="search-icon" aria-hidden="true"></span>
          <input type="search" id="history-search" placeholder="搜索历史问题" aria-label="搜索查询历史" maxlength="2000" autocomplete="off">
        </label>
        <div class="history-list" id="history-list"></div>
      </section>
      <footer class="sidebar-footer">
        <a class="nav-item admin-entry" id="admin-link" href="#admin" hidden></a>
        <div class="user-area" id="user-area"></div>
      </footer>
    </div>
  </aside>
  <div class="nav-backdrop" id="nav-backdrop" hidden></div>
  <div class="shell" id="shell">
    <header class="mobile-bar">
      <button class="icon-button" id="open-menu" aria-label="打开工作台导航" aria-controls="sidebar" aria-expanded="false"></button>
      <span>澄知 RAG</span><span class="mobile-divider" aria-hidden="true"></span><span class="mobile-context">企业知识工作台</span>
    </header>
    <div class="connection" id="connection" role="status" hidden>暂时无法连接工作区</div>
    <main id="main" tabindex="-1"><p class="loading-panel" role="status">正在加载工作区…</p></main>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
